<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Vinayaga Parking</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f5ede0;
            color: #2d1a0e;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ganesh-img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 4px 16px rgba(180,100,0,0.15));
        }

        .token-badge {
            background: rgba(180,100,0,0.08);
            border: 1px solid rgba(180,100,0,0.15);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 13px;
            color: #b07840;
            margin-bottom: 16px;
        }

        .token-badge span { color: #c45c00; font-weight: 700; }

        .card {
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(180,100,0,0.12);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(180,100,0,0.08);
        }

        .card label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #b07840;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .input-wrapper { position: relative; }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: rgba(255,255,255,0.8);
            border: 1.5px solid rgba(180,100,0,0.15);
            border-radius: 14px;
            color: #2d1a0e;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(45,26,14,0.25);
            font-size: 16px;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            border-color: #c45c00;
            background: white;
            box-shadow: 0 0 0 4px rgba(196,92,0,0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #c45c00, #e8900a);
            border: none;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(196,92,0,0.3);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(196,92,0,0.4); }
        .btn-primary:active { transform: translateY(0); }

        .btn-scan {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            background: rgba(196,92,0,0.08);
            border: 1px solid rgba(196,92,0,0.2);
            border-radius: 14px;
            color: #c45c00;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            background: rgba(180,100,0,0.06);
            border: 1px solid rgba(180,100,0,0.15);
            border-radius: 14px;
            color: #b07840;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover { background: rgba(180,100,0,0.1); transform: translateY(-1px); }

        video {
            width: 100%;
            border-radius: 14px;
            margin-top: 10px;
            display: none;
            border: 1.5px solid rgba(196,92,0,0.2);
        }

        canvas { display: none; }

        #scanStatus {
            text-align: center;
            color: #b07840;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .token-preview {
            width: 100%;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(180,100,0,0.12);
            border-radius: 24px;
            padding: 28px;
            display: none;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(180,100,0,0.08);
        }

        .token-preview.show { display: block; }

        .token-header { text-align: center; margin-bottom: 20px; }

        .token-header h2 {
            font-size: 12px;
            font-weight: 700;
            color: #b07840;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .token-number {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #c45c00, #e8900a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin: 8px 0;
        }

        .divider { height: 1px; background: rgba(180,100,0,0.1); margin: 16px 0; }

        .token-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .token-row .key {
            font-size: 12px;
            color: #b07840;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .token-row .value {
            font-size: 14px;
            font-weight: 700;
            color: #2d1a0e;
            letter-spacing: 0.5px;
        }

        .charges-box {
            background: rgba(196,92,0,0.06);
            border: 1px solid rgba(196,92,0,0.15);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 16px;
        }

        .charges-box p {
            font-size: 11px;
            color: #b07840;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .charge-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .charge-row span:first-child { font-size: 13px; color: #7c3a00; }
        .charge-row span:last-child { font-size: 13px; font-weight: 700; color: #c45c00; }

        .thank-you { text-align: center; margin-top: 16px; font-size: 13px; color: #b07840; }

        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes flash {
            0% { box-shadow: 0 0 0 0 rgba(196,92,0,0.4); }
            50% { box-shadow: 0 0 40px 10px rgba(196,92,0,0.15); }
            100% { box-shadow: 0 0 0 0 rgba(196,92,0,0); }
        }
        .flash { animation: flash 0.5s ease; }
    </style>
</head>
<body>

<div class="container">

    <!-- Search Button -->
    <button onclick="toggleSearch()" style="
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c45c00, #e8900a);
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(196,92,0,0.3);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
    </button>

    <!-- Search Panel -->
    <div id="searchPanel" style="
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #f5ede0;
        z-index: 200;
        overflow-y: auto;
        padding: 24px;
    ">
        <div style="display: flex; align-items: center; margin-bottom: 24px;">
            <button onclick="toggleSearch()" style="background: none; border: none; font-size: 24px; cursor: pointer; margin-right: 12px;">←</button>
            <h2 style="color: #7c3a00; font-size: 18px; font-weight: 800;">Token History</h2>
        </div>

        <!-- Vehicle Search -->
        <div style="position: relative; margin-bottom: 12px;">
            <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px;">🔍</span>
            <input type="text" id="historySearch" placeholder="Enter vehicle number..." oninput="searchHistory()" style="
                width: 100%;
                padding: 16px 16px 16px 48px;
                font-size: 16px;
                font-weight: 600;
                font-family: 'Inter', sans-serif;
                background: white;
                border: 1.5px solid rgba(180,100,0,0.15);
                border-radius: 14px;
                color: #2d1a0e;
                text-transform: uppercase;
                letter-spacing: 1px;
                outline: none;
            "/>
        </div>

        <!-- Date Filter -->
        <div style="margin-bottom:12px;">
            <label style="font-size:11px; color:#b07840; font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px;">Date</label>
            <input type="date" id="dateFilter" onchange="searchHistory()" style="
                width:100%;
                padding:10px 12px;
                font-size:14px;
                font-family:'Inter',sans-serif;
                background:white;
                border:1.5px solid rgba(180,100,0,0.15);
                border-radius:10px;
                color:#2d1a0e;
                outline:none;
            "/>
        </div>

        <!-- Time Filter -->
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div style="flex:1;">
                <label style="font-size:11px; color:#b07840; font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px;">From</label>
                <div style="display:flex; gap:6px; align-items:center;">
                    <select id="timeFromHour" onchange="searchHistory()" style="flex:1; padding:10px 8px; font-size:14px; font-family:'Inter',sans-serif; background:white; border:1.5px solid rgba(180,100,0,0.15); border-radius:10px; color:#2d1a0e; outline:none; text-align:center;">
                        <option value="">--</option>
                        <option>1</option><option>2</option><option>3</option><option>4</option>
                        <option>5</option><option>6</option><option>7</option><option>8</option>
                        <option>9</option><option>10</option><option>11</option><option>12</option>
                    </select>
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button id="fromAM" onclick="toggleAmPm('from', 'AM')" style="padding:5px 10px; font-size:11px; font-weight:700; font-family:'Inter',sans-serif; background:linear-gradient(135deg,#c45c00,#e8900a); color:white; border:none; border-radius:6px; cursor:pointer;">AM</button>
                        <button id="fromPM" onclick="toggleAmPm('from', 'PM')" style="padding:5px 10px; font-size:11px; font-weight:700; font-family:'Inter',sans-serif; background:rgba(196,92,0,0.1); color:#c45c00; border:1px solid rgba(196,92,0,0.2); border-radius:6px; cursor:pointer;">PM</button>
                    </div>
                </div>
            </div>
            <div style="flex:1;">
                <label style="font-size:11px; color:#b07840; font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px;">To</label>
                <div style="display:flex; gap:6px; align-items:center;">
                    <select id="timeToHour" onchange="searchHistory()" style="flex:1; padding:10px 8px; font-size:14px; font-family:'Inter',sans-serif; background:white; border:1.5px solid rgba(180,100,0,0.15); border-radius:10px; color:#2d1a0e; outline:none; text-align:center;">
                        <option value="">--</option>
                        <option>1</option><option>2</option><option>3</option><option>4</option>
                        <option>5</option><option>6</option><option>7</option><option>8</option>
                        <option>9</option><option>10</option><option>11</option><option>12</option>
                    </select>
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button id="toAM" onclick="toggleAmPm('to', 'AM')" style="padding:5px 10px; font-size:11px; font-weight:700; font-family:'Inter',sans-serif; background:rgba(196,92,0,0.1); color:#c45c00; border:1px solid rgba(196,92,0,0.2); border-radius:6px; cursor:pointer;">AM</button>
                        <button id="toPM" onclick="toggleAmPm('to', 'PM')" style="padding:5px 10px; font-size:11px; font-weight:700; font-family:'Inter',sans-serif; background:linear-gradient(135deg,#c45c00,#e8900a); color:white; border:none; border-radius:6px; cursor:pointer;">PM</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="historyResults"></div>
    </div>

    <!-- Header -->
    <div style="position:relative; width:100%; margin-bottom:16px; text-align:center;">
        <div style="position:absolute; left:0; top:35px; text-align:left;">
            <p id="currentDate" style="font-size:11px; font-weight:700; color:#7c3a00; letter-spacing:0.5px;"></p>
            <p id="currentDay" style="font-size:11px; color:#b07840; margin-top:2px;"></p>
            <p id="currentTime" style="font-size:15px; font-weight:800; color:#c45c00; margin-top:4px; letter-spacing:0.5px;"></p>
        </div>
        <img src="ganesh.png.png" alt="Lord Vinayaga" class="ganesh-img" />
        <h1 style="font-size:16px; font-weight:800; color:#7c3a00;">Sri Vinayaga Parking</h1>
        <p style="font-size:12px; color:#b07840;">Two Wheeler Stand</p>
    </div>

    <!-- Badges -->
    <div class="token-badge">Next Token: <span id="badgeToken">0001</span></div>
    <div class="token-badge">Today's Vehicles: <span id="dailyCount">0</span></div>

    <!-- Token Preview -->
    <div class="token-preview" id="tokenPreview">
        <div class="token-header">
            <h2>Sri Vinayaga Two Wheeler Stand</h2>
            <p style="font-size:12px; color:#b07840; margin-top:4px;">Token Generated</p>
            <div class="token-number" id="displayToken">0001</div>
        </div>
        <div class="divider"></div>
        <div class="token-row"><span class="key">Vehicle</span><span class="value" id="displayVehicle">—</span></div>
        <div class="token-row"><span class="key">Entry</span><span class="value" id="displayDate">—</span></div>
        <div class="token-row"><span class="key">Time</span><span class="value" id="displayTime">—</span></div>
        <div class="charges-box">
            <p>Charges</p>
            <div class="charge-row"><span>12 Hours</span><span>Rs. 20</span></div>
            <div class="charge-row"><span>24 Hours</span><span>Rs. 40</span></div>
        </div>
        <div class="thank-you">Thank you! Drive Safe 🙏</div>
    </div>

    <!-- Input Card -->
    <div class="card">
        <label>Vehicle Number</label>
        <div class="input-wrapper">
            <span class="input-icon">🏍</span>
            <input type="text" id="vehicleInput" placeholder="TN 99 AF 0800" />
        </div>
        <button class="btn-scan" id="scanBtn" onclick="startScan()">📷 Scan Number Plate</button>
        <p id="scanCounter" style="text-align:center; font-size:12px; color:#b07840; margin-top:12px;"></p>
        <video id="camera" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <p id="scanStatus"></p>
        <button class="btn-primary" onclick="generateToken()">Generate Token 🖨</button>
    </div>

    <button class="btn-secondary" onclick="resetToken()">🔄 New Roll — Reset Token Number</button>

</div>

<script>
    let tokenNumber = parseInt(localStorage.getItem("tokenNumber")) || 1;
    let fromPeriod = 'AM';
    let toPeriod = 'PM';

    const SHEET_URL = "https://script.google.com/macros/s/AKfycbzb6xE0waZoR4XxAQwxNk7Ev-GyfzQxHtwCympDBoI6Cpd_bvqkRCiwOG13cb1LQc9a/exec";
    const SEARCH_URL = "https://script.google.com/macros/s/AKfycbzb6xE0waZoR4XxAQwxNk7Ev-GyfzQxHtwCympDBoI6Cpd_bvqkRCiwOG13cb1LQc9a/exec";

    function pad(num) { return String(num).padStart(4, '0'); }

    function updateBadge() { document.getElementById("badgeToken").innerText = pad(tokenNumber); }

    function getDailyCount() {
        const today = new Date().toLocaleDateString("en-IN");
        const stored = JSON.parse(localStorage.getItem("dailyData")) || { date: today, count: 0 };
        if (stored.date !== today) {
            localStorage.setItem("dailyData", JSON.stringify({ date: today, count: 0 }));
            return 0;
        }
        return stored.count;
    }

    function incrementDailyCount() {
        const today = new Date().toLocaleDateString("en-IN");
        const count = getDailyCount() + 1;
        localStorage.setItem("dailyData", JSON.stringify({ date: today, count: count }));
        updateDailyBadge();
    }

    function updateDailyBadge() { document.getElementById("dailyCount").innerText = getDailyCount(); }

    function getScanCount() {
        const month = new Date().getMonth();
        const stored = JSON.parse(localStorage.getItem("scanData")) || { month: month, count: 0 };
        if (stored.month !== month) {
            localStorage.setItem("scanData", JSON.stringify({ month: month, count: 0 }));
            return 0;
        }
        return stored.count;
    }

    function incrementScanCount() {
        const month = new Date().getMonth();
        const count = getScanCount() + 1;
        localStorage.setItem("scanData", JSON.stringify({ month: month, count: count }));
        updateScanBadge();
    }

    function updateScanBadge() {
        const count = getScanCount();
        const remaining = 2500 - count;
        document.getElementById("scanCounter").innerText = `Scans used: ${count}/2500 (${remaining} remaining)`;
    }

    async function saveToSheet(tokenNo, vehicleNumber, date, time) {
        try {
            await fetch(SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tokenNo, vehicleNumber, date, time })
            });
        } catch (err) { console.log("Offline"); }
    }

    function generateToken() {
        const vehicle = document.getElementById("vehicleInput").value.toUpperCase().trim();
        if (!vehicle) { alert("Please enter vehicle number!"); return; }

        const now = new Date();
        const date = now.toLocaleDateString("en-IN");
        const time = now.toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit' });

        document.getElementById("displayToken").innerText = pad(tokenNumber);
        document.getElementById("displayVehicle").innerText = vehicle;
        document.getElementById("displayDate").innerText = date;
        document.getElementById("displayTime").innerText = time;

        const preview = document.getElementById("tokenPreview");
        preview.classList.add("show");
        preview.classList.remove("flash");
        void preview.offsetWidth;
        preview.classList.add("flash");

        saveToSheet(pad(tokenNumber), vehicle, date, time);
        incrementDailyCount();
        tokenNumber++;
        localStorage.setItem("tokenNumber", tokenNumber);
        updateBadge();
        document.getElementById("vehicleInput").value = "";
        document.getElementById("vehicleInput").focus();
    }

    function resetToken() {
        if (confirm("Are you sure you want to reset?\nThis will start token number from 0001!")) {
            const now = new Date();
            const date = now.toLocaleDateString("en-IN");
            const time = now.toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit' });
            saveToSheet("NEW ROLL", "ROLL RESET", date, time);
            tokenNumber = 1;
            localStorage.setItem("tokenNumber", 1);
            updateBadge();
            document.getElementById("tokenPreview").classList.remove("show");
            alert("Token number reset to 0001!");
        }
    }

    async function startScan() {
        const video = document.getElementById("camera");
        const scanBtn = document.getElementById("scanBtn");
        const scanStatus = document.getElementById("scanStatus");

        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        });

        video.srcObject = stream;
        video.style.display = "block";
        scanStatus.style.display = "block";
        scanStatus.innerText = "Point camera at number plate...";

        scanBtn.innerText = "📸 Capture";
        scanBtn.onclick = async function () {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            stream.getTracks().forEach(track => track.stop());
            video.style.display = "none";
            scanStatus.innerText = "Reading number plate...";

            canvas.toBlob(async function (blob) {
                const formData = new FormData();
                formData.append("upload", blob, "plate.jpg");
                formData.append("regions", "in");

                try {
                    incrementScanCount();
                    const response = await fetch("https://api.platerecognizer.com/v1/plate-reader/", {
                        method: "POST",
                        headers: { "Authorization": "Token e45068806cc76c8bb1061873dc6eda2905e0b837" },
                        body: formData
                    });

                    const result = await response.json();
                    if (result.results && result.results.length > 0) {
                        const plate = result.results[0].plate.toUpperCase();
                        const formatted = plate.slice(0,2) + ' ' + plate.slice(2,4) + ' ' + plate.slice(4,6) + ' ' + plate.slice(6);
                        document.getElementById("vehicleInput").value = formatted;
                        scanStatus.innerText = "✅ Number plate detected: " + formatted;
                    } else {
                        scanStatus.innerText = "❌ Could not read. Please type manually.";
                    }
                } catch (err) {
                    scanStatus.innerText = "❌ Error reading plate. Please type manually.";
                }

                scanBtn.innerText = "📷 Scan Number Plate";
                scanBtn.onclick = startScan;
            }, "image/jpeg");
        };
    }

    function updateClock() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const weekday = now.toLocaleDateString("en-IN", { weekday: 'long' });
        const time = now.toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        document.getElementById("currentDate").innerText = `${day}/${month}/${year}`;
        document.getElementById("currentDay").innerText = weekday;
        document.getElementById("currentTime").innerText = time;
    }

    function toggleAmPm(type, period) {
        if (type === 'from') {
            fromPeriod = period;
            document.getElementById("fromAM").style.background = period === 'AM' ? 'linear-gradient(135deg, #c45c00, #e8900a)' : 'rgba(196,92,0,0.1)';
            document.getElementById("fromAM").style.color = period === 'AM' ? 'white' : '#c45c00';
            document.getElementById("fromPM").style.background = period === 'PM' ? 'linear-gradient(135deg, #c45c00, #e8900a)' : 'rgba(196,92,0,0.1)';
            document.getElementById("fromPM").style.color = period === 'PM' ? 'white' : '#c45c00';
        } else {
            toPeriod = period;
            document.getElementById("toAM").style.background = period === 'AM' ? 'linear-gradient(135deg, #c45c00, #e8900a)' : 'rgba(196,92,0,0.1)';
            document.getElementById("toAM").style.color = period === 'AM' ? 'white' : '#c45c00';
            document.getElementById("toPM").style.background = period === 'PM' ? 'linear-gradient(135deg, #c45c00, #e8900a)' : 'rgba(196,92,0,0.1)';
            document.getElementById("toPM").style.color = period === 'PM' ? 'white' : '#c45c00';
        }
        searchHistory();
    }

    function toggleSearch() {
        const panel = document.getElementById("searchPanel");
        if (panel.style.display === "none") {
            panel.style.display = "block";
            document.getElementById("historySearch").focus();
        } else {
            panel.style.display = "none";
            document.getElementById("historyResults").innerHTML = "";
            document.getElementById("historySearch").value = "";
        }
    }

    function formatDate(val) {
        if (!val) return "—";
        const str = String(val);
        if (str.includes("T")) {
            const d = new Date(str);
            return d.toLocaleDateString("en-IN");
        }
        return str;
    }

    function formatTime(val) {
        if (!val) return "—";
        const str = String(val);
        if (str.includes("T")) {
            const d = new Date(str);
            return d.toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit' });
        }
        return str;
    }

    function toMinutes(t) {
        if (!t) return 0;
        const str = String(t);
        if (str.includes("T")) {
            const d = new Date(str);
            return d.getHours() * 60 + d.getMinutes();
        }
        const match24 = str.match(/^(\d+):(\d+)/);
        if (match24) return parseInt(match24[1]) * 60 + parseInt(match24[2]);
        const match12 = str.match(/(\d+):(\d+)\s*(am|pm)/i);
        if (match12) {
            let hours = parseInt(match12[1]);
            const mins = parseInt(match12[2]);
            const period = match12[3].toLowerCase();
            if (period === 'pm' && hours !== 12) hours += 12;
            if (period === 'am' && hours === 12) hours = 0;
            return hours * 60 + mins;
        }
        return 0;
    }

    async function searchHistory() {
        const query = document.getElementById("historySearch").value.toUpperCase().trim();
        const timeFromHour = document.getElementById("timeFromHour").value;
        const timeToHour = document.getElementById("timeToHour").value;
        const timeFrom = timeFromHour ? `${timeFromHour}:00 ${fromPeriod}` : "";
        const timeTo = timeToHour ? `${timeToHour}:00 ${toPeriod}` : "";
        const dateFilterVal = document.getElementById("dateFilter").value;
        const resultsDiv = document.getElementById("historyResults");

        if (query.length < 3 && !dateFilterVal) {
            resultsDiv.innerHTML = "<p style='text-align:center; color:#b07840; font-size:13px;'>Type a vehicle number or select a date...</p>";
            return;
        }

        resultsDiv.innerHTML = "<p style='text-align:center; color:#b07840; font-size:13px;'>Searching...</p>";

        try {
            const response = await fetch(SEARCH_URL + "?search=" + query, { redirect: 'follow' });
            let data = await response.json();

            // Filter by date
            if (dateFilterVal) {
                const selected = new Date(dateFilterVal);
                const selectedStr1 = `${String(selected.getDate()).padStart(2,'0')}/${String(selected.getMonth()+1).padStart(2,'0')}/${selected.getFullYear()}`;
                const selectedStr2 = `${selected.getDate()}/${selected.getMonth()+1}/${selected.getFullYear()}`;
                data = data.filter(record => {
                 const rd = formatDate(record.date);
                 return rd === selectedStr1 || rd === selectedStr2;
                });
            }

            // Filter by time range
            if (timeFrom && timeTo) {
                const fromMins = toMinutes(timeFrom);
                const toMins = toMinutes(timeTo);
                data = data.filter(record => {
                    const recordMins = toMinutes(record.time);
                    return recordMins >= fromMins && recordMins <= toMins;
                });
            }

            if (data.length === 0) {
                resultsDiv.innerHTML = "<p style='text-align:center; color:#b07840; font-size:13px;'>No records found.</p>";
                return;
            }

            const reversed = data.reverse();
            resultsDiv.innerHTML = `
                <p style="font-size:12px; color:#b07840; margin-bottom:12px;">${reversed.length} record(s) found</p>
                <div style="overflow-x:auto;">
                    <table style="width:100%; border-collapse:collapse; font-family:'Inter',sans-serif; font-size:13px;">
                        <thead>
                            <tr style="background:rgba(196,92,0,0.1);">
                                <th style="padding:10px 8px; text-align:left; color:#7c3a00; font-weight:700; border-bottom:2px solid rgba(180,100,0,0.2);">S.No</th>
                                <th style="padding:10px 8px; text-align:left; color:#7c3a00; font-weight:700; border-bottom:2px solid rgba(180,100,0,0.2);">Token</th>
                                <th style="padding:10px 8px; text-align:left; color:#7c3a00; font-weight:700; border-bottom:2px solid rgba(180,100,0,0.2);">Vehicle</th>
                                <th style="padding:10px 8px; text-align:left; color:#7c3a00; font-weight:700; border-bottom:2px solid rgba(180,100,0,0.2);">Date</th>
                                <th style="padding:10px 8px; text-align:left; color:#7c3a00; font-weight:700; border-bottom:2px solid rgba(180,100,0,0.2);">Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${reversed.map((record, index) => `
                                <tr style="border-bottom:1px solid rgba(180,100,0,0.08); ${index % 2 === 0 ? 'background:rgba(255,255,255,0.5);' : ''}">
                                    <td style="padding:10px 8px; color:#b07840;">${index + 1}</td>
                                    <td style="padding:10px 8px; font-weight:700; color:#c45c00;">#${record.tokenNo}</td>
                                    <td style="padding:10px 8px; font-weight:600; color:#2d1a0e;">${record.vehicleNumber}</td>
                                    <td style="padding:10px 8px; color:#2d1a0e;">${formatDate(record.date)}</td>
                                    <td style="padding:10px 8px; color:#2d1a0e;">${formatTime(record.time)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;

        } catch (err) {
            resultsDiv.innerHTML = "<p style='text-align:center; color:#b07840; font-size:13px;'>Error fetching records. Check internet connection.</p>";
        }
    }

    document.getElementById("vehicleInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") generateToken();
    });

    updateClock();
    setInterval(updateClock, 1000);
    updateBadge();
    updateScanBadge();
    updateDailyBadge();
</script>
